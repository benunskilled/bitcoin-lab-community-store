# One image, four lightweight services (one per long-running process). All
# four share the same SQLite file under ${APP_DATA_DIR}/data (better-sqlite3
# in WAL mode is safe for multiple local processes).
#
# restart: unless-stopped rather than on-failure - these are dauerlaeufer, and
# on-failure does not bring a service back that exited cleanly, nor reliably
# after a Docker daemon restart.
#
# Every service has a healthcheck. The three worker processes have no HTTP
# port, so each writes a heartbeat into the shared database every 30s and its
# check reads that back read-only (see src/lib/health.js). Without this a
# crash-looping worker was completely invisible: the app kept showing as
# running and its tables simply stopped growing.
#
# IMPORTANT: replace the `image:` digest below after your first
# `git push --tags` triggers .github/workflows/release.yml in the
# `bitcoin-lab` source repo - see that workflow's final step for the exact
# ghcr.io/<owner>/bitcoin-lab:<version>@sha256:<digest> to paste in here.

services:
  app_proxy:
    environment:
      APP_HOST: bitcoinlab-node_dashboard_1
      APP_PORT: 8788

  dashboard:
    image: ghcr.io/benunskilled/bitcoin-lab:1.12.7@sha256:607a7525f6c029a2305372b9ff993159cec234f992811ee3cf04cb616b749437
    user: "1000:1000"
    init: true
    restart: unless-stopped
    command: ["node", "src/dashboard-server.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data
      DASHBOARD_PORT: "8788"
    healthcheck:
      # Double-quoted deliberately: the JavaScript contains ": " (in the
      # ternary "? 0 : 1"), and an unquoted YAML plain scalar treats that as a
      # key/value separator - which silently turned this argument into a
      # mapping, made the whole compose file fail schema validation, and left
      # the app with no containers at all. Keep the quotes.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8788/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  peer-profiler:
    image: ghcr.io/benunskilled/bitcoin-lab:1.12.7@sha256:607a7525f6c029a2305372b9ff993159cec234f992811ee3cf04cb616b749437
    user: "1000:1000"
    init: true
    restart: unless-stopped
    command: ["node", "src/peer-profiler.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('/app/src/lib/health').assertFresh('peer-profiler', 120000)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  relay-profiler:
    image: ghcr.io/benunskilled/bitcoin-lab:1.12.7@sha256:607a7525f6c029a2305372b9ff993159cec234f992811ee3cf04cb616b749437
    user: "1000:1000"
    init: true
    restart: unless-stopped
    command: ["node", "src/relay-profiler.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('/app/src/lib/health').assertFresh('relay-profiler', 120000)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  stratum-race:
    image: ghcr.io/benunskilled/bitcoin-lab:1.12.7@sha256:607a7525f6c029a2305372b9ff993159cec234f992811ee3cf04cb616b749437
    user: "1000:1000"
    init: true
    restart: unless-stopped
    command: ["node", "src/stratum-race.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('/app/src/lib/health').assertFresh('stratum-race', 120000)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

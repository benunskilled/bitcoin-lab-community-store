version: "3.7"

# One image, four lightweight services (one per long-running process) -
# each gets Docker's native `restart: on-failure` instead of a hand-rolled
# supervisor. All four share the same SQLite file under ${APP_DATA_DIR}/data
# (better-sqlite3 in WAL mode is safe for multiple local processes).
#
# IMPORTANT: replace the `image:` digest below after your first
# `git push --tags` triggers .github/workflows/release.yml in the
# `bitcoin-lab` source repo - see that workflow's final step for the exact
# ghcr.io/<owner>/bitcoin-lab:<version>@sha256:<digest> to paste in here.

services:
  app_proxy:
    environment:
      APP_HOST: bitcoinlab-node_dashboard_1
      APP_PORT: 8788

  dashboard:
    image: ghcr.io/benunskilled/bitcoin-lab:1.2.1@sha256:66ce5b7d8cc6382a40b8e6d0a7e337590c49b42c83e2bf2a0b6bde278960e5f0
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["node", "src/dashboard-server.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data
      DASHBOARD_PORT: "8788"

  peer-profiler:
    image: ghcr.io/benunskilled/bitcoin-lab:1.2.1@sha256:66ce5b7d8cc6382a40b8e6d0a7e337590c49b42c83e2bf2a0b6bde278960e5f0
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["node", "src/peer-profiler.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data

  relay-profiler:
    image: ghcr.io/benunskilled/bitcoin-lab:1.2.1@sha256:66ce5b7d8cc6382a40b8e6d0a7e337590c49b42c83e2bf2a0b6bde278960e5f0
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["node", "src/relay-profiler.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data

  stratum-race:
    image: ghcr.io/benunskilled/bitcoin-lab:1.2.1@sha256:66ce5b7d8cc6382a40b8e6d0a7e337590c49b42c83e2bf2a0b6bde278960e5f0
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["node", "src/stratum-race.js"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_BITCOIN_NODE_IP: $APP_BITCOIN_NODE_IP
      APP_BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      APP_BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      APP_BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      APP_BITCOIN_NETWORK: $APP_BITCOIN_NETWORK
      DATA_DIR: /data

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- flask -->
  <g stroke="#e6edf3" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M208 96 h96" />
    <path d="M224 96 v104 l-84 148 a28 28 0 0 0 24 42 h184 a28 28 0 0 0 24 -42 l-84 -148 v-104" />
  </g>
  <path d="M158 314 h196" stroke="#f7931a" stroke-width="16" stroke-linecap="round" />

  <!-- bitcoin sign inside the flask liquid, drawn as paths so it renders
       identically everywhere and does not depend on an installed font -->
  <g transform="translate(252 356)" fill="none" stroke="#f7931a" stroke-width="10"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M-14 -26 V 26" />
    <path d="M-14 -26 H 4 a 13 13 0 0 1 0 26 H -14" />
    <path d="M-14 0 H 8 a 13 13 0 0 1 0 26 H -14" />
    <path d="M-4 -36 V -26" /><path d="M8 -36 V -26" />
    <path d="M-4 26 V 36" /><path d="M8 26 V 36" />
  </g>

  <!-- rising "relay" dots -->
  <circle cx="330" cy="150" r="7" fill="#f7931a"/>
  <circle cx="356" cy="130" r="5" fill="#f7931a" opacity="0.7"/>
  <circle cx="378" cy="108" r="4" fill="#f7931a" opacity="0.5"/>
</svg>

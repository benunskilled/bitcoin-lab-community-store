manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.15.9"
tagline: Measure your peers, keep the ones that deliver
description: >-
  Your peers decide how fast you hear about a new block, and Bitcoin Core picks them at random. Bitcoin Lab watches which of them actually delivers each block first - over Core's ZMQ interface, timestamped before anything else happens - and builds a lifetime First % for every peer you have. After a day of blocks the ranking tells you which of your connections are worth anything, and which are along for the ride.


  Then you act on it. Keep a good peer and Core holds on to it instead of letting it rotate away; drop one that never delivers and Core hands you a fresh random peer to rank in its place. Inbound peers are ranked too, and can be promoted when they turn out to be reachable. An optional toggle runs the whole loop for you, off until you switch it on - and your proven peers are put back after a restart, which Core itself will not do.


  Stratum Race is the other half: it times how quickly each mining pool turns a new block into fresh work, your own local pool included, with eight public solo pools racing as the baseline. Every second a miner spends on an already-solved block is a stale share, and that is the window curated peers close.


releaseNotes: >-
  A peer had to be connected through 144 blocks - a full day - before the rotation was allowed to judge it. That is a long time to watch a peer deliver blocks without being permitted to keep it, and Bitcoin Core drops peers on its own schedule in the meantime: one delivering 15% of blocks was watched for twenty hours and then lost. The bar is now 50 blocks, about eight hours. The same threshold decides when a peer that never delivers is dropped, so that happens sooner too - occasionally to a peer that was merely unlucky, which is the deliberate trade. A dropped peer keeps its record and resumes it if it comes back; a peer lost to waiting is gone with nothing learned.



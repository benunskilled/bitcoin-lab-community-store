id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.12.18"
tagline: Rank your peers, race your pool's latency - built for solo miners
description: >-
  Bitcoin Lab is built for solo miners running their own pool on their Bitcoin node: it turns peer connections into measurable relay performance, and Stratum Race confirms it's actually working.


  It continuously observes which peers deliver new blocks first via Bitcoin Core's ZMQ interface and maintains long-term peer performance history. Most of the actual speed gain comes from acting on that history: add your best-ranked peers as manual/trusted connections so they stay put, and disconnect outbound peers that never deliver anything - Core replaces a disconnected outbound with a fresh, random one, which you then rank the same way. Inbound peers get ranked too and can be promoted as manual if reachable - Bitcoin Lab probes the real port with a TCP handshake first, since only the port in the reported address is temporary, and not every peer listens.


  An optional toggle automates that loop: it disconnects outbound peers with a full day of eligibility and zero first-seen blocks, and promotes or swaps in the best-performing peer as manual - one step at a time, off by default.


  A parallel Stratum Race tracks per-pool latency (avg/median/P90) and win rate over time, including any local solo-mining pool you add by host and port. This is the main reason it exists: as you act on that peer ranking above and your node relays blocks faster, a pool built on that node should get its own new-block template out faster too - every extra second a miner spends hashing the previous, already-solved block is wasted work (a stale share), so faster templates mean fewer of those. Stratum Race is how you actually see that latency improve, instead of assuming better peers helped. The public pools are the baseline your own pool's number is measured against.


  Bitcoin Lab does not modify Bitcoin consensus behavior or mining. It is an observability and peer-optimization tool for solo miners and advanced node operators.
releaseNotes: >-
  Added an optional automatic peer-rotation toggle: every ~10 minutes it
  disconnects outbound peers that have had a full day to prove themselves
  and never delivered a block first (Core replaces them with a fresh
  random peer), then promotes or swaps in the best-performing candidate
  as a manual peer if it's a clear improvement - one step per pass, off
  by default. A new Peer Rotation panel on the dashboard shows the toggle
  and a log of what it has done.


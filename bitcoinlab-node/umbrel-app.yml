manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "2.5.0"
tagline: See which peers bring you new blocks first
description: >-
  Every new block reaches your node through one of your peers. Bitcoin Lab notes for every block who was first and ranks your peers by it.


  Core has eight manual slots it never fills on its own, so on a default node they sit empty. Slot Fill uses them. It takes peers from Core's own address book and puts them where your node has the fewest connections: other regions and other providers, as far as your node's networks allow. It goes for spread, not speed.


  Stratum Race times how fast your own pool turns a new block into fresh work, side by side with public solo pools. No miner needed, just a pool app on your Umbrel. Slot Fill and Stratum Race are both off by default, and Bitcoin Lab never touches bitcoin.conf, wallets or keys.


releaseNotes: >-
  Blocks name their pool in full, and a block with no known pool and no name of its own reads "Unknown". F2Pool's new fish tag is recognised. Stratum Race only counts a block your node knows, and its range is a switch: 10 blocks, 100 blocks or all time. Compact-block shares cover the last 100 blocks, and a block that can't be told apart reads as unclear. The rotation log keeps 1,000 entries and says more clearly why a peer was dropped.
developer: benunskilled
website: https://github.com/benunskilled/bitcoin-lab
dependencies:
  - bitcoin
repo: https://github.com/benunskilled/bitcoin-lab
support: https://github.com/benunskilled/bitcoin-lab/issues

icon: https://raw.githubusercontent.com/benunskilled/bitcoin-lab-community-store/main/bitcoinlab-node/icon.svg
port: 8790

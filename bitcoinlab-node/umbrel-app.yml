manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.16.1"
tagline: Measure your peers, keep the ones that deliver
description: >-
  Your peers decide how fast you hear about a new block, and Bitcoin Core picks them at random. Bitcoin Lab watches which of them actually delivers each block first - over Core's ZMQ interface, timestamped before anything else happens - and ranks every peer you have by how often it wins. The rank comes from the last few days rather than from a whole lifetime, so a peer whose routing has changed cannot coast on an old record. After a day of blocks the ranking tells you which of your connections are worth anything, and which are along for the ride.


  Then you act on it. Keep a good peer and Core holds on to it instead of letting it rotate away; drop one that never delivers and Core hands you a fresh random peer to rank in its place. Inbound peers are ranked too, and can be promoted when they turn out to be reachable. An optional toggle runs the whole loop for you, off until you switch it on - and your proven peers are put back after a restart, which Core itself will not do.


  Stratum Race is the other half: it times how quickly each mining pool turns a new block into fresh work, your own local pool included, with eight public solo pools racing as the baseline. Every second a miner spends on an already-solved block is a stale share, and that is the window curated peers close. Whether that is worth chasing is a fair question: half a second off a ten-minute job is 0.08% of your miner's time. Bitcoin Lab is for people who enjoy chasing it anyway.


releaseNotes: >-
  The First % column now shows the number the ranking actually sorts by. Since 1.16.0 a peer is ranked on the last 500 blocks, but the column still showed its whole-life rate - so the order looked wrong and nothing on the page could explain it. Two manual peers here sat at 21.2% and 37.5%, in that order, because across the window they are 33.8% and 33.4%, which is level. The heading now names the window, the cell carries it, and the lifetime figure moved into the cell's tooltip. The parked list and the rotation log still show the lifetime rate, because their own rules are scaled by it.


  Tor, I2P and CJDNS peers are named in the address column instead of showing a meaningless local address. A peer that dials in over one of those networks reaches Bitcoin Core through your own proxy container, so the address Core reports belongs to that container, not to the peer. The row now says "Tor peer" and keeps the real address in the tooltip. A peer your node dialled out to over Tor still shows its own .onion address, which is worth seeing.


  The rotation no longer swaps a peer out and straight back in. A displaced peer was disconnected and parked, and parked peers come back on their lifetime record - the very number the peer had just been displaced despite, because displacement goes by the recent window. On a real node that cost two disconnects and two addnodes in ten minutes for no change. A displaced peer now keeps its connection, drops back to being an ordinary outbound peer, and has to earn a slot again like everyone else. Only a peer that is actually offline gets parked.


  And a new slot holder really is safe for its first 50 blocks now. That was implemented as "has this peer been eligible for 50 blocks", which is a question about its whole life - so a peer with any history walked into its slot already past a grace it had never had.



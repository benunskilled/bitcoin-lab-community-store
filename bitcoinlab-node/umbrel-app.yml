manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.15.5"
tagline: Rank your peers, race your pool's latency - built for solo miners
description: >-
  Your node hears about each new block from whichever peer relays it to you first. Until it does, your pool is still handing out work on a block that has already been solved - hashrate spent on nothing. Bitcoin Lab finds the peers that consistently deliver first, keeps them, and then measures whether your pool actually got faster because of it.


  Bitcoin Core picks its peers for network health, not for your latency, so your peer set is random and stays random. Bitcoin Lab watches which of them hand you each new block first, over Core's ZMQ interface, and builds a lifetime First % for each one. Core credits only the peer whose block was new to your node, so each block has exactly one first - no guessing, and no credit for relaying something you already had. A single block proves nothing either way, which is why the percentage only starts to mean something after a day or so of them.


  Acting on that ranking is where the speed comes from. Keep your best peers as manual connections so Core holds on to them, and disconnect the ones that never deliver - Core replaces a dropped outbound peer with a fresh, random one, which you then rank the same way. Inbound peers are ranked too and can be promoted when they are reachable; Bitcoin Lab probes for the real listening port first, since the port an inbound peer reports is only its temporary one. Trying one is free: nothing is written and no connection is touched until that probe succeeds and one of Core's eight manual slots is confirmed, and a Test button answers the reachability question on its own.


  Those eight slots are the scarcest thing here, so a manual peer that goes offline gives its slot up within hours rather than sitting on it - but it is not lost. Its address is kept with its record and quietly re-tested, and it takes a slot straight back the moment it answers again. That is what makes reclaiming quickly safe, and both halves are scaled by the peer's own First %: a peer that delivers 30% of your blocks first keeps its slot for a day and is chased for months, one at 1% for an hour and a few days. An optional toggle runs this whole loop for you every ten minutes, off until you switch it on. For the sharpest results, set Bitcoin Core's outgoing connections to clearnet only - not "both". Over Tor you are timing circuits rather than peers, and a .onion peer cannot be made manual at all, so every outbound slot held by one is a slot this loop can never improve.


  Stratum Race is the other half, and the reason the first half matters: it times how quickly each mining pool turns a new block into fresh work, your own local pool included. Every second a miner spends hashing the previous, already-solved block is wasted work - a stale share - so faster templates mean fewer of them. Established public pools race alongside yours as the baseline, because a pool racing alone would trivially win every time.


  Expect tens to a few hundred milliseconds. Small - but it is exactly the window in which a miner is working on a block that can no longer win.
releaseNotes: >-
  A full review of the app found five real defects introduced in the 1.15.x
  releases, and this fixes all of them along with everything else it turned up.


  The important one: with automatic rotation switched on, a manual peer that
  had been offline earlier could be retired and immediately re-added, over and
  over, every ten minutes. Because only one peer may join the manual set per
  pass, that loop used up every pass and no genuinely better peer was ever
  promoted while it ran. If you had rotation on, it was doing nothing useful.
  Two related fixes: a peer added by hand could be dropped seconds later, and a
  peer Bitcoin Core never manages to connect used to hold one of the eight
  slots permanently, invisible to every screen.


  Adding a peer is now genuinely all-or-nothing. Previously a refused addnode
  could leave the peer in neither the manual list nor the parked list - losing
  months of ranking data - or leave the manual set one peer smaller with
  nothing said about it. Nothing moves now until the step that can fail has
  succeeded.


  Tables scroll properly on a phone instead of squeezing nine columns into the
  width and overprinting them. "Show all" no longer stops working while a peer
  is being added. The peer ranking query no longer slows down as the node ages.
  The weekly database compaction no longer rewrites the entire file to reclaim
  nothing, which could cost a block's measurement.


  And one piece of advice now stated where it matters: set Bitcoin Core's
  outgoing connections to clearnet only. Over Tor you are measuring circuits
  rather than peers, and a .onion peer can never be made a manual connection at
  all. The dashboard counts how many of your peers are on Tor when any are.



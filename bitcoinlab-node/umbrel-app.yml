manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.6.0"
tagline: Find your best relaying Bitcoin peers
description: >-
  Bitcoin Lab turns your Bitcoin node's peer connections into measurable relay performance.


  It continuously observes which peers deliver new blocks first via Bitcoin Core's ZMQ interface, maintains long-term peer performance history (First/Eligible/First%, ping, sessions, connection time), and helps you identify valuable peers worth keeping as manual connections - without replacing Bitcoin Core's own automatic outbound peer discovery.


  A parallel Stratum Race measures which mining pools deliver new block templates fastest, including any local solo-mining pool you add by host and port.


  Bitcoin Lab does not modify Bitcoin consensus behavior or mining. It is an observability and network-optimization tool for advanced node operators.
releaseNotes: >-
  Core keeps trying to reconnect a dropped manual peer on its own, but that can silently stall. The Manual Peers table now shows how long an offline trusted peer has actually been down instead of a flat dash, the Umbrel home-screen widget shows online-vs-total manual peers at a glance, and a background check logs any currently-offline trusted peer every 10 minutes for a durable record even when the dashboard is closed.


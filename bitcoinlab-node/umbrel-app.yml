manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "2.6.0"
tagline: See which peers bring you new blocks first
description: >-
  Every new block reaches your node through one of your peers. Bitcoin Lab notes for every block who was first and ranks your peers by it.


  Core has eight manual slots it never fills on its own, so on a default node they sit empty. Slot Fill uses them. It takes peers from Core's own address book and puts them where your node has the fewest connections: other regions and other providers, as far as your node's networks allow. It goes for spread, not speed. It only fills free slots: peers already there stay until they go offline.


  Stratum Race times how fast your own pool turns a new block into fresh work, side by side with public solo pools. No miner needed, just a pool app on your Umbrel. Slot Fill and Stratum Race are both off by default, and Bitcoin Lab never touches bitcoin.conf, wallets or keys.


releaseNotes: >-
  Rotation is now Slot Fill. It fills your node's free manual slots with peers from Core's own address book, placed where your node has the fewest connections – other regions and other providers – and it never touches Core's own peers. It only fills free slots and only removes peers that stay offline, so if your eight slots are already full, remove a few by hand to make room. After this update Slot Fill starts switched off, so you choose it yourself. The log shows every peer it adds and why, and every peer that leaves: offline for too long, or disconnected by you. Peer names are readable, outbound peers show where they are, and the legend explains every mark. Bitcoin Lab also notes whether the peer that delivered a block was a high-bandwidth peer, which Peer Map 2.8.0 uses for its route.

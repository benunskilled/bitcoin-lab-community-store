id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.12.10"
tagline: Find your best relay peers and Stratum Race pool speed
description: >-
  Bitcoin Lab turns your Bitcoin node's peer connections into measurable relay performance.


  It continuously observes which peers deliver new blocks first via Bitcoin Core's ZMQ interface and maintains long-term peer performance history (First/Eligible/First%, ping, sessions, connection time). Most of the actual speed gain comes from acting on that history: add your best-ranked peers as manual/trusted connections so they stay put, and disconnect outbound peers that never deliver anything - Core replaces a disconnected outbound with a fresh, random one, which you then rank the same way.


  A parallel Stratum Race tracks per-pool latency (avg/median/P90) and win rate over time, including any local solo-mining pool you add by host and port. This is the main reason it exists: as your peer curation above pays off and your node relays blocks faster, a pool built on that node should get its own new-block template out faster too - Stratum Race is how you actually see that latency improve, instead of assuming better peers helped. Comparing external pools against each other is a secondary byproduct of the same measurement.


  Bitcoin Lab does not modify Bitcoin consensus behavior or mining. It is an observability and peer-optimization tool for advanced node operators.
releaseNotes: >-

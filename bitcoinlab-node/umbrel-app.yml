    type: "four-stats"
    refresh: "60s"
    endpoint: "dashboard:8788/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Live Peers"
          text: "42"
          subtext: "connected"
        - title: "Best Peer"
          text: "33%"
          subtext: "203.0.113.12:8333"
        - title: "Fastest Pool"
          text: "80ms"
          subtext: "AtlasPool"
        - title: "Manual"
          text: "8/8"
          subtext: "manual peers online"
  - id: "traffic"
    type: "three-stats"
    refresh: "3600s"
    endpoint: "dashboard:8788/api/widget/traffic"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - text: "8.4 GB"
          subtext: "sent today"
        - text: "1.9 GB"
          subtext: "received today"

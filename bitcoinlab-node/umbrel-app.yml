manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "1.2.0"
tagline: Find your best relaying Bitcoin peers
description: >-
  Bitcoin Lab turns your Bitcoin node's peer connections into measurable relay performance.


  It continuously observes which peers deliver new blocks first via Bitcoin Core's ZMQ interface, maintains long-term peer performance history (First/Eligible/First%, ping, sessions, connection time), and helps you identify valuable peers worth keeping as manual connections - without replacing Bitcoin Core's own automatic outbound peer discovery.


  A parallel Stratum Race measures which mining pools deliver new block templates fastest, including any local solo-mining pool you add by host and port.


  Bitcoin Lab does not modify Bitcoin consensus behavior or mining. It is an observability and network-optimization tool for advanced node operators.
releaseNotes: >-
  Fixed a bug where stratum pool connections were recycled every 30 seconds, long before a real block (~10 min apart) could arrive - the Stratum Race should now actually populate. Added a time-range selector (last 10 blocks / 1h / 24h / 7d / 30d / all) and a last-race-winner badge to the Stratum Race table. Outbound Peers now shows the real Core connection type instead of the manual/trusted overlay. Added a Client (subver) column across peer tables. "Add as Manual" now re-probes 8333/9333 before adding (fixes inbound peers with ephemeral ports) and persists so it survives restarts; manual peers can now be properly Removed (also drops the Core addnode entry) separately from Disconnect, and the 8-manual-connection cap Bitcoin Core enforces is now respected and shown as a slot counter. Peer panels are now collapsible.


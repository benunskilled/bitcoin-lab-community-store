manifestVersion: 1
id: bitcoinlab-node
category: bitcoin
name: Bitcoin Lab
version: "2.2.0"
tagline: See which peers bring you new blocks first
description: >-
  Every new block reaches your node through one of your peers. Some peers are first again and again, others never. Bitcoin Lab notes for every block who was first and ranks your peers by it. Keep the fast ones as manual peers, drop the ones that never deliver and get fresh ones to rank, or let rotation do it for you.


  Rotation only works on the outbound peers Core picks for you. Inbound peers are ranked too, but rotation never keeps them or drops them for a low score. Many of them don't accept connections at all, and the port you see is only the one they called from, so there is no address to dial back.


  Mining solo? Stratum Race times how fast your own pool turns a new block into fresh work, side by side with public pools. Rotation and Stratum Race are both off by default, and Bitcoin Lab never touches bitcoin.conf, wallets or keys.


releaseNotes: >-
  Stratum Race shows the latest block and the average instead of median and P90, and says that a pool app works without a miner. The ranking marks disguised peers and pool nodes and offers no manual slot to a peer that can never deliver. On phones a legend explains the marks, and a tap on an open explanation folds it shut. One widget now shows traffic and your peers in and out. Storage shows the database size while folded, and pages load faster. Built on an updated Node 22 image with security fixes.
developer: benunskilled
website: https://github.com/benunskilled/bitcoin-lab
dependencies:
  - bitcoin
repo: https://github.com/benunskilled/bitcoin-lab
support: https://github.com/benunskilled/bitcoin-lab/issues

icon: https://raw.githubusercontent.com/benunskilled/bitcoin-lab-community-store/main/bitcoinlab-node/icon.svg
port: 8790
gallery:

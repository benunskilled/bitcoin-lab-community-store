manifestVersion: 1
id: bitcoinlab-peermap
category: bitcoin
name: Peer Map
version: "0.1.0"
tagline: See where your node's peers are
description: >-
  Your node talks to dozens of other nodes around the world, and Bitcoin Core lists them as a wall of addresses. Peer Map puts them on a world map instead: one marker per country, split into the three kinds of connection that matter - the manual peers you chose yourself, the outbound peers Core picked for you, and the inbound peers that found you.


  Switch each kind on and off, click a country to see exactly which peers are there, and read the details in a table per kind: client version, network, P2P transport, ping and how long the connection has lasted. Peers that have no place on a map are counted rather than dropped - Tor, I2P and CJDNS have no location, and on umbrelOS inbound IPv6 arrives through Docker and shows up as a private address.


  It is built to cost nothing while you are not looking. There is no background job: Bitcoin Core is asked for its peer list only while the dashboard is open, at most every ten seconds. The app is a single small binary with the map and the country database built in, so nothing is downloaded and no peer address ever leaves your node.


  IP geolocation by DB-IP (https://db-ip.com), licensed CC BY 4.0. Map data from Natural Earth.

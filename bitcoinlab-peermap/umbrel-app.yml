manifestVersion: 1
id: bitcoinlab-peermap
category: bitcoin
name: Peer Map
version: "0.7.0"
tagline: See where your node's peers are
description: >-
  Your node talks to dozens of other nodes around the world, and Bitcoin Core lists them as a wall of addresses. Peer Map puts them on a world map instead: one marker per country, split into the three kinds of connection that matter - the manual peers you chose yourself, the outbound peers Core picked for you, and the inbound peers that found you. Zoom in and the markers split into regions, so Australia becomes New South Wales, Victoria and Queensland.


  Switch each kind on and off, click a country or region to see exactly which peers are there, and read the details in a table per kind: location, the network operator the address belongs to, what kind of software the peer runs, network, P2P transport, ping and how long the connection has lasted. Three peers in three countries can still be three rented machines at one company, and the operator is where that shows. Peers that have no place on a map are counted rather than dropped - Tor, I2P and CJDNS have no location, and on umbrelOS inbound IPv6 arrives through Docker and shows up as a private address.


  Bitcoin Lab, in the same store, takes the step after this one: it measures which of these peers actually delivers each new block first, and lets you keep the ones that do.


  It is built to cost nothing while you are not looking. There is no background job: Bitcoin Core is asked for its peer list only while the dashboard is open, at most every ten seconds, and a dashboard nobody has touched for half an hour pauses itself. The app is a single small binary with the map and the location database built in, so nothing is downloaded and no peer address ever leaves your node.


  IP geolocation and network data by DB-IP (https://db-ip.com), licensed CC BY 4.0. Map data from Natural Earth.


releaseNotes: >-
  The route of a block now has **four stretches**, each with its own lever: the block reaching your peer, the hop into your node, Core building the next template, and your pool turning it into a job. Where the time goes is where you can make it shorter.


  Beside this block's route there is the **typical block**: every stop at its median over the last hundred blocks. One block scatters; the median shows whether a change made anything shorter. Switch between the two above the route - the choice is remembered.


  The template stop needs Bitcoin Lab 1.22.0. With an older Bitcoin Lab the card is as it was.



manifestVersion: 1
id: bitcoinlab-peermap
category: bitcoin
name: Peer Map
version: "2.2.0"
tagline: See who your node is really talking to
description: >-
  Your node talks to strangers all day. Each one says what software it runs, but is it telling the truth? Peer Map takes a closer look: what the peer offers, whether it wants your transactions, how often it pings or asks for addresses, which chain it is on. A normal node, a wallet, a crawler, or a spy in disguise? Find out.


  The map shows where your peers are, who hosts them and whether they are really spread out. Even your own outbound slots can hold a surprise, like a node that left Bitcoin for another chain. Open port 8333 and more strangers come knocking.


  With Bitcoin Lab from the same store, Peer Map also follows every new block: which pool mined it and which of your peers brought it to you first. No peer address goes to any outside service, and Peer Map only asks Core for its peers when you're looking.


  IP geolocation and network data by DB-IP (https://db-ip.com), licensed CC BY 4.0. Map data from Natural Earth.


releaseNotes: >-
  A grey line under each label says what sets a peer apart: why it is disguised, what an unknown program does, pruned, another chain, a pool or syncing. Cards fold to their title, the page holds your place while tables refresh, and every kind has a filter level for versions and names. Bitcoin Purity is flagged as another chain, and more clients are recognised.
